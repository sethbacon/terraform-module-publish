---
name: CodeQL

# `tsc --noEmit` is a type check, not a security analysis. None of the
# taint-shaped properties in this action — a remote response body flowing into a
# URL path, unvalidated JSON, a URL built from an operator input, a bearer
# credential reaching a log — had any automated detector before this.
#
# The schedule matters as much as the PR trigger: dependency-review only
# evaluates dependencies a PR *changes*, so it is silent about an advisory
# published tomorrow against something already pinned in the lockfile and
# already inlined into dist/index.js.
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: javascript-typescript
          # security-extended picks up the injection and SSRF queries that the
          # default suite leaves out, which is the whole reason this is here.
          queries: security-extended

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:javascript-typescript
