name: Terraform module publish
description: Publish a Terraform/OpenTofu module version to a self-hosted registry or HCP Terraform / Terraform Enterprise.
author: sethbacon
branding:
  icon: upload-cloud
  color: purple

inputs:
  registry-type:
    description: '"private" (self-hosted registry) or "hcp" (HCP Terraform / TFE).'
    required: true
  namespace:
    description: Module namespace / organization.
    required: true
  name:
    description: Module name.
    required: true
  provider:
    description: Module provider / target system.
    required: true
  version:
    description: Module version to publish (e.g. 1.2.3).
    required: true
  # --- private registry ---
  registry-url:
    description: Base URL of the private registry (required for registry-type=private).
    required: false
    default: ""
  api-key:
    description: API key for the private registry (Bearer). Required for registry-type=private.
    required: false
    default: ""
  ca-cert:
    description: >-
      PEM certificate(s) for the CA that issued the registry's TLS certificate,
      for a registry fronted by a private CA. Trusting the CA keeps both
      certificate-chain and hostname verification on. When set, it replaces the
      default trust store for the action's registry requests.
    required: false
    default: ""
  skip-tls-verify:
    description: >-
      REMOVED. This disabled certificate AND hostname verification on requests
      carrying the registry API key, so setting it now fails the step. Use
      `ca-cert` instead.
    required: false
    default: "false"
  # --- HCP / TFE ---
  hcp-address:
    description: HCP Terraform / TFE base URL.
    required: false
    default: https://app.terraform.io
  hcp-token:
    description: HCP/TFE API token (Bearer). Required for registry-type=hcp.
    required: false
    default: ""
  vcs-repo-identifier:
    description: VCS repo identifier (org/repo) used to create the module if missing.
    required: false
    default: ""
  vcs-branch:
    description: >-
      VCS branch for a VCS-connected HCP module. Leave empty (the default) to
      create a TAG-based module, whose versions HCP imports from pushed git
      tags. Setting a branch creates a branch-based module, whose versions stay
      'pending' until a module archive is uploaded — which this action does not
      do, and which now fails the step rather than reporting a publish.
    required: false
    default: ""
  vcs-oauth-token-id:
    description: HCP VCS OAuth token ID used to create the module if missing.
    required: false
    default: ""
  commit-sha:
    description: >-
      Commit SHA recorded on the new HCP module version. Left empty (the
      default) it falls back to the runner's GITHUB_SHA — the commit the
      workflow ran on — so the registry's version record is tied to a commit
      without the workflow having to set anything. Set it only when the version
      genuinely comes from a different commit.
    required: false
    default: ""
  # --- common ---
  wait-for-publish:
    description: Wait until the version is available/ready in the registry.
    required: false
    default: "false"
  timeout-seconds:
    description: Wait timeout in seconds (when wait-for-publish is true).
    required: false
    default: "180"
  registry-allowed-hosts:
    description: >-
      Comma/newline-separated hosts the registry-url / hcp-address requests may
      reach, applied to the initial URL and to every redirect hop. A `*.` prefix
      matches exactly one label (`*.registry.example.com`). When set, only these
      hosts are permitted — which is how a deliberately-private, self-hosted
      registry stays reachable. When empty, any public host is permitted and
      private, link-local or otherwise reserved destinations are refused.
    required: false
    default: ""

outputs:
  published:
    description: '"true" when a version was published (or sync triggered); "false" if it already existed.'
  message:
    description: Human-readable status message.

runs:
  using: node24
  main: dist/index.js
